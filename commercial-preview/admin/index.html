<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>QCRCE 产品管理</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:20px;background:#101c2a;color:#edf4fa}input,textarea,select,button{font:inherit;padding:10px;margin:6px 0;box-sizing:border-box}input,textarea,select{width:100%}label{display:block;margin-top:12px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}section{border:1px solid #536579;padding:20px;margin:20px 0;border-radius:10px}</style></head><body><h1>QCRCE 管理后台 · 开发预览</h1><p>仅限授权管理员。临时令牌只保存在当前页面内存，不写入浏览器存储。正式上线前应接入 Cloudflare Access。</p><label>管理员令牌<input id="token" type="password" autocomplete="off"></label><button id="load">读取产品</button> <button id="inquiries">读取咨询</button><pre id="list"></pre><section><h2>新增或修改产品</h2><form id="product"><label>Slug<input name="slug" required pattern="[a-z0-9-]+" maxlength="100"></label><label>英文名称<input name="title_en" required maxlength="200"></label><label>中文名称<input name="title_zh" required maxlength="200"></label><label>英文描述<textarea name="description_en" maxlength="5000"></textarea></label><label>中文描述<textarea name="description_zh" maxlength="5000"></textarea></label><label>美元价格（空白为询价）<input name="price" type="number" min="0" step="0.01"></label><label>状态<select name="status"><option value="draft">草稿</option><option value="published">发布</option><option value="archived">归档</option></select></label><button>保存产品</button></form><pre id="status" aria-live="polite"></pre></section><script>const $=id=>document.getElementById(id);async function api(path,options={}){const r=await fetch('/api/admin/'+path,{...options,headers:{'Authorization':'Bearer '+$('token').value,'Content-Type':'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}async function load(path){try{$('list').textContent=JSON.stringify(await api(path),null,2)}catch(e){$('list').textContent=e.message}}$('load').onclick=()=>load('products');$('inquiries').onclick=()=>load('inquiries');$('product').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.price_cents=v.price===''?null:Math.round(Number(v.price)*100);delete v.price;try{await api('products',{method:'POST',body:JSON.stringify(v)});$('status').textContent='保存成功';await load('products')}catch(e){$('status').textContent=e.message}};</script></body></html>
